name: PR checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Android checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Build and test Android modules
        run: >-
          ./gradlew :reviewflow-core:testAndroidHostTest
          :review-compose:testDebugUnitTest :review-compose:assembleRelease
          :sample-app:testDebugUnitTest :sample-app:assembleDebug
          --stacktrace --console=plain
      - name: Android Lint
        run: ./gradlew :review-compose:lintDebug :sample-app:lintDebug --stacktrace --console=plain
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-failure-reports
          path: |
            review-core/build/reports/
            review-core/build/test-results/
            review-compose/build/reports/
            review-compose/build/test-results/
            sample-app/build/reports/
            sample-app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  ios-abi:
    name: iOS and ABI checks
    # Explicit ARM64 runner matches iosSimulatorArm64Test.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      # Core ABI validation includes Android as well as the Apple targets.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Test on the iOS simulator
        run: ./gradlew :reviewflow-core:iosSimulatorArm64Test --stacktrace --console=plain
      - name: Check Core API and ABI compatibility
        run: ./gradlew :reviewflow-core:checkLegacyAbi --stacktrace --console=plain
      - name: Build the SwiftUI demo and Kotlin bridge
        run: >-
          xcodebuild -project samples/ios/ReviewFlowDemo.xcodeproj
          -scheme ReviewFlowDemo -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath samples/ios/build
          -resultBundlePath samples/ios/ci-results.xcresult
          CODE_SIGNING_ALLOWED=NO build
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-abi-failure-reports
          path: |
            review-core/build/reports/
            review-core/build/test-results/
            review-core/build/kotlin/abi-legacy/
            samples/ios/ci-results.xcresult/
          if-no-files-found: ignore
          retention-days: 7
